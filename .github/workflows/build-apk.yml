name: Build PDA Android App

on:
  push:
    branches:
      - master
    paths:
      - 'PDA UI/**'
      - 'PDA-App/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pda_test
          POSTGRES_PASSWORD: pda_test
          POSTGRES_DB: pda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (for Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Test PDA server rules and concurrent saves
        working-directory: ./server
        env:
          PDA_TEST_DATABASE_URL: postgresql://pda_test:pda_test@127.0.0.1:5432/pda_test
        run: |
          npm ci
          node --test tests/pdaPicking.test.js tests/pdaWeights.test.js tests/pdaConsolidation.test.js

      - name: Test PDA workflows in Chromium
        working-directory: ./PDA UI
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Install dependencies
        working-directory: ./PDA-App
        run: npm ci

      - name: Prepare Web Assets from PDA UI
        working-directory: ./PDA-App
        run: npm run prepare:web

      - name: Copy Web Assets to Android (without overwriting native config)
        working-directory: ./PDA-App
        run: npx cap copy android

      - name: Update Capacitor plugins only
        working-directory: ./PDA-App
        run: npx cap update android

      - name: Verify build.gradle was NOT overwritten
        working-directory: ./PDA-App/android/app
        run: |
          echo "=== build.gradle content ==="
          cat build.gradle
          echo ""
          echo "=== variables.gradle content ==="
          cat ../variables.gradle
          echo ""
          echo "=== Checking versionCode ==="
          grep -n 'versionCode' build.gradle
          echo "=== Checking targetSdkVersion ==="
          grep -n 'targetSdkVersion' ../variables.gradle
          echo "=== Checking signingConfigs ==="
          grep -n 'signingConfig' build.gradle
          echo "=== Checking debug.keystore exists ==="
          ls -la debug.keystore

      - name: Build APK (Debug)
        working-directory: ./PDA-App/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gava-PDA-App.apk
          path: PDA-App/android/app/build/outputs/apk/debug/app-debug.apk
