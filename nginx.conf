server {
    listen 80;
    server_name localhost;

    # A Frontend (Access UI) statikus fájljainak kiszolgálása
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # A PDA UI statikus fájljainak kiszolgálása (NO cache – fejlesztés alatt)
    location /pda {
        alias /usr/share/nginx/pda;
        index index.html;
        try_files $uri $uri/ /pda/index.html;

        # HTML ne legyen cachelve soha
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # JS és CSS: mindig friss verzió
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }

    # Az API kérések továbbítása a Node.js backend felé
    location /api/v1/ {
        proxy_pass http://gava_api:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
